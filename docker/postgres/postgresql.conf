# Minimal PostgreSQL 17 configuration with logical replication enabled

# Essential settings for logical replication
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10
max_logical_replication_workers = 4

# Basic connection settings
listen_addresses = '*'
port = 5432

# Basic logging
log_statement = 'none'
log_destination = 'stderr'

# Timezone
timezone = 'UTC'
